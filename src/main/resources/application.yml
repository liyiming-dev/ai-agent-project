spring:
  application:
    name: yu-ai-code-mother-backend
  profiles:
    active: local

  # session
  session:
    store-type: redis
    # session三十天过期
    timeout: 2592000
  # mysql
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_agent_project
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
    profiles:
      active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi????
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yiming.aiagentproject.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
