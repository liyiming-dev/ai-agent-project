spring:
  application:
    name: ai-agent-project
  profiles:
    active: local

  # session（由 SessionConfig @EnableRedisHttpSession 启用）
  session:
    # session 30 天过期
    timeout: 30d
  # mysql
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_agent_project
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000
        # 跨站 AJAX 需要携带 cookie 时改为 none + secure: true（需 https）
        # 本地开发若前后端不同端口：推荐用 Vite 代理到同源，或临时 same-site: none + secure: false
        same-site: lax
        http-only: true

# springdoc-openapi????
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yiming.aiagentproject.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
# aliyun OSS
# 访问凭证通过环境变量提供:
#   OSS_ACCESS_KEY_ID     = 你的 AccessKey ID
#   OSS_ACCESS_KEY_SECRET = 你的 AccessKey Secret
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java-ai-baiyue
    region: cn-beijing
