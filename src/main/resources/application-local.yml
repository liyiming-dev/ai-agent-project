langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-5f831bd2b3bd43c7942eb71867da7e6b
      model-name: deepseek-v4-flash
      # 仅用于路由/图片计划/HTML多文件结果对象的非流式调用，不需要大输出
      max-tokens: 8192
      log-requests: true      # 开启请求日志
      log-responses: true
      strict-json-schema: true
      response-format: json_object
      max-retries : 3
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-5f831bd2b3bd43c7942eb71867da7e6b
      model-name: deepseek-v4-flash
      # HTML / 多文件流式生成的输出预算
      max-tokens: 16384
      log-requests: true
      log-responses: true
    # 推理模型（Vue 项目生成使用，启用 thinking 模式）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-5f831bd2b3bd43c7942eb71867da7e6b
      model-name: deepseek-v4-flash
      # Vue 项目带 reasoning + tool calls，输出预算适当大一些
      max-tokens: 24576
      log-requests: true
      log-responses: true
    # 路由判断模型（仅用于代码生成类型路由判断，可使用更轻量/便宜的模型）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-565e5cf98fa94bc98242dfe3876e0c45
      model-name: qwen-turbo
      temperature: 0.0
      max-tokens: 4096
      max-retries: 3
      log-requests: true
      log-responses: true
      response-format: json_object


