langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen3.5-flash-2026-02-23  # qwen-flash3、qwen-plus、qwen-max 等
      temperature: 0.4
      max-tokens: 32000
      log-requests: true      # 开启请求日志
      log-responses: true
      strict-json-schema: true
      response-format: json_object
      max-retries : 3
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen3.5-flash-2026-02-23
      max-tokens: 32000
      log-requests: true
      log-responses: true


logging:
  level:
    dev.langchain4j: DEBUG